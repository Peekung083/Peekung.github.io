<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Six Character Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Rainbow Six Character Manager</h1>
        
        <!-- Add Character Form -->
        <div class="card mb-4">
            <div class="card-header">
                <h3>Add New Character</h3>
            </div>
            <div class="card-body">
                <form id="addCharacterForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <input type="text" class="form-control" id="name" placeholder="Character Name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <select class="form-control" id="role" required>
                                <option value="">Select Role</option>
                                <option value="Attacker">Attacker</option>
                                <option value="Defender">Defender</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <input type="text" class="form-control" id="nationality" placeholder="Nationality" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <input type="text" class="form-control" id="ability" placeholder="Special Ability" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Character</button>
                </form>
            </div>
        </div>

        <!-- Characters List -->
        <div class="card">
            <div class="card-header">
                <h3>Character List</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Nationality</th>
                                <th>Ability</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="characterList">
                            <th>Name</th>
                            <th>Role</th>
                            <th>Nationality</th>
                            <th>Ability</th>
                            <th>Actions</th>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Character Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Character</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editCharacterForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="editName" placeholder="Character Name" required>
                        </div>
                        <div class="mb-3">
                            <select class="form-control" id="editRole" required>
                                <option value="">Select Role</option>
                                <option value="Attacker">Attacker</option>
                                <option value="Defender">Defender</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" id="editNationality" placeholder="Nationality" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" id="editAbility" placeholder="Special Ability" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
